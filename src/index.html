<!doctype html>
<html lang="th"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Cherrywebbrowser</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="calendar.css"><link rel="stylesheet" href="novel-themes.css"><link rel="stylesheet" href="brand.css"><link rel="stylesheet" href="window-drag.css"><script src="icons.js" defer></script><script src="calendar.js" defer></script><script src="calendar-ui.js" defer></script><script src="themes.js" defer></script><script src="theme-studio.js" defer></script><script src="renderer.js" defer></script><script src="window-drag.js" defer></script>
</head><body class="cherry-shell" data-theme="midnight" data-sidebar="full" data-panel="closed" data-graphics="on">
<aside class="sidebar">
  <div class="brand"><div class="brand-signature" role="img" aria-label="Cherry Browser"><strong class="brand-name" aria-hidden="true">cherry<span>.</span></strong><small class="brand-caption" aria-hidden="true">BROWSER <span id="app-version" class="app-version"></span></small></div><button id="compact-toggle" class="icon-button" title="ย่อเมนูด้านข้าง" aria-label="ย่อเมนูด้านข้าง" aria-expanded="true" aria-controls="main-navigation" data-icon="sidebar"></button></div>
  <nav id="main-navigation" class="navigation" aria-label="เมนูหลัก">
    <button data-page="home"><span data-icon="home"></span><span class="nav-label">หน้าแรก</span></button>
    <button data-page="workspaces"><span data-icon="grid"></span><span class="nav-label">My Workspace</span><span class="nav-tail" data-icon="down"></span></button>
    <button data-page="bookmarks"><span data-icon="bookmark"></span><span class="nav-label">บุ๊กมาร์ก</span><span id="bookmark-count" class="nav-count"></span></button>
    <button data-page="history"><span data-icon="history"></span><span class="nav-label">ประวัติ</span></button>
    <button data-page="calendar" title="Calendar · ปฏิทิน"><span data-icon="calendar"></span><span class="nav-label">Calendar · ปฏิทิน</span></button>
    <button data-page="downloads"><span data-icon="download"></span><span class="nav-label">ดาวน์โหลด</span><span id="download-count" class="nav-count"></span></button>
    <button data-panel="ai"><span data-icon="sparkles"></span><span class="nav-label">AI Assist</span><small class="badge nav-tail">AI</small></button>
    <button data-panel="notes"><span data-icon="notes"></span><span class="nav-label">Notes · Post-it · เตือน</span></button>
  </nav>
  <section class="workspace-section"><div class="section-label"><span>Workspaces</span><button class="icon-button" data-action="new-workspace" title="สร้าง workspace" aria-label="สร้าง workspace" data-icon="plus"></button></div><div id="workspace-list"></div><button class="new-workspace" data-action="new-workspace"><span data-icon="plus"></span><span>New Workspace</span></button></section>
  <div class="sidebar-bottom"><button class="ai-promo" data-panel="ai"><span data-icon="sparkles"></span><div><strong>Cherry AI <small class="badge">BETA</small></strong><p>พื้นที่สำหรับไอเดีย<br>และสิ่งที่อยากรู้</p></div><span data-icon="arrow"></span></button><button class="settings-button" data-page="settings"><span data-icon="settings"></span><span class="nav-label">การตั้งค่า</span></button><button class="theme-footer" data-page="themes"><span data-icon="wand"></span><span>A BRIGHTER<br>TOMORROW TOGETHER</span></button></div>
</aside>
<header class="titlebar"><div id="tabs" class="tabs" role="tablist" aria-label="แท็บ"></div><button id="new-tab" class="icon-button" title="แท็บใหม่ (Ctrl+T)" aria-label="แท็บใหม่" data-icon="plus"></button><div class="titlebar-drag"><span>A LITTLE SPACE FOR YOUR CURIOSITY</span></div><div class="native-controls-space"></div></header>
<div class="toolbar"><button id="back" class="icon-button" title="ย้อนกลับ (Alt+←)" aria-label="ย้อนกลับ" data-icon="back"></button><button id="forward" class="icon-button" title="ไปข้างหน้า (Alt+→)" aria-label="ไปข้างหน้า" data-icon="forward"></button><button id="reload" class="icon-button" title="โหลดใหม่ (Ctrl+R)" aria-label="โหลดอีกครั้ง" data-icon="reload"></button>
<form id="address-form" class="address-bar"><button id="page-info" type="button" class="icon-button" title="ข้อมูลและสิทธิ์เว็บไซต์" aria-label="ข้อมูลเว็บไซต์" data-icon="sliders"></button><input id="address" aria-label="ที่อยู่เว็บไซต์หรือคำค้นหา" placeholder="ค้นหาหรือพิมพ์ URL" autocomplete="off" spellcheck="false"><span id="private-indicator" hidden>PRIVATE</span><button id="bookmark-toggle" type="button" class="icon-button" title="บุ๊กมาร์ก (Ctrl+D)" aria-label="บันทึกบุ๊กมาร์ก" data-icon="star"></button></form>
<button id="split-button" class="icon-button" data-action="split" title="Split View — เปิดสองเว็บ" aria-label="Split View" data-icon="split"></button><button class="icon-button" data-action="reader" title="Reader — อ่านหน้านี้" aria-label="Reader" data-icon="reader"></button><button class="icon-button" data-action="clip" title="เก็บข้อความที่เลือกเป็นโน้ต" aria-label="เก็บคลิป" data-icon="clip"></button><button class="toolbar-avatar" data-page="themes" title="Theme Studio" aria-label="Theme Studio"><img id="profile-avatar" src="../assets/anime/avatar-cherry.webp" alt="Cherry"></button><button class="icon-button" data-action="palette" title="คำสั่งและแท็บ (Ctrl+K)" aria-label="Command palette" data-icon="command"></button></div>
<div id="viewport"><div id="split-head" hidden></div><main id="content" tabindex="-1"></main><div id="split-divider" hidden></div></div>
<aside id="side-panel" aria-label="แผงเครื่องมือ" hidden><div class="panel-header"><h2 id="panel-title"></h2><button id="close-panel" class="icon-button" title="ปิดแผง" aria-label="ปิดแผง" data-icon="close"></button></div><div id="panel-content"></div></aside>
<dialog id="form-dialog"><form id="modal-form"><div class="dialog-head"><h2 id="dialog-title"></h2><button type="button" class="icon-button" data-action="close-dialog" aria-label="ปิด" data-icon="close"></button></div><div id="dialog-body"></div><div class="dialog-actions"><button id="confirm-cancel" type="button" class="secondary-button" data-action="close-dialog">ยกเลิก</button><button id="confirm-accept" class="primary-button" type="submit">บันทึก</button></div></form></dialog>
<dialog id="palette-dialog"><div class="palette-search"><span data-icon="search"></span><input id="palette-input" aria-label="ค้นหาคำสั่ง แท็บ บุ๊กมาร์ก" placeholder="ค้นหาคำสั่ง แท็บ หรือบุ๊กมาร์ก…" autocomplete="off"><kbd>ESC</kbd></div><div id="palette-results"></div><footer>↑ ↓ เลือก · Enter เปิด · Ctrl+K ค้นหาจากทุกแท็บ</footer></dialog>
<div id="toast" role="status" aria-live="polite"></div>
</body></html>
